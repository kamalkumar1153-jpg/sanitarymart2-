<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanitary Mart - Products</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom Line Clamp to prevent text cutoff */
    .product-title {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.8rem; /* Keeps layout consistent even with short titles */
    }
  </style>
</head>
<body class="bg-gray-50 pb-24">

  <!-- Header Section -->
  <header class="bg-white shadow-sm p-4 sticky top-0 z-10 flex justify-between items-center">
    <h1 class="text-xl font-bold text-teal-600 flex items-center gap-2">
      <span>🚿</span> Sanitary Mart
    </h1>
    <button class="border border-blue-500 text-blue-600 px-4 py-1.5 rounded-full font-medium flex items-center gap-1 text-sm">
      🛒 Cart <span id="cart-count" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">0</span>
    </button>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-4">
    
    <!-- Category Tabs -->
    <div class="flex gap-2 overflow-x-auto py-2 mb-4 scrollbar-none">
      <button class="bg-teal-700 text-white px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">All Products</button>
      <button class="border border-gray-300 text-gray-700 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">Taps & Faucets</button>
      <button class="border border-gray-300 text-gray-700 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">Wash Basins</button>
    </div>

    <!-- Products Grid Container -->
    <div id="product-grid" class="grid grid-cols-2 gap-4">
      <!-- Cards JavaScript se dynamically render honge -->
    </div>

  </main>

  <!-- Floating Cart Bar (Bottom Right Fix) -->
  <div id="floating-cart" class="fixed bottom-6 right-6 bg-teal-700 text-white px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 z-20 hidden">
    <div class="text-xl">🛍️</div>
    <div class="font-bold text-sm">₹<span id="floating-total">0</span></div>
    <div id="floating-badge" class="bg-amber-400 text-slate-900 font-bold text-xs px-2 py-1 rounded-full">0</div>
  </div>

  <!-- JavaScript Code -->
  <script>
    // Sample Product Data (Representing database response)
    const products = [
      {
        id: 1,
        title: "Edge One Piece Toilet Seat",
        price: 20243,
        originalPrice: 26990,
        discount: "25% OFF",
        image: "https://via.placeholder.com/200x200?text=Toilet+1"
      },
      {
        id: 2,
        title: "Premium Sanitary Toilet Bowl",
        price: 13293,
        originalPrice: 18990,
        discount: "30% OFF",
        image: "https://via.placeholder.com/200x200?text=Toilet+2"
      },
      {
        id: 3,
        title: "Square Western Toilet Commode",
        price: 18500,
        originalPrice: 24000,
        discount: "30% OFF",
        image: "https://via.placeholder.com/200x200?text=Toilet+3"
      },
      {
        id: 4,
        title: "Modern Floor Mounted Water Closet",
        price: 15400,
        originalPrice: 22000,
        discount: "30% OFF",
        image: "https://via.placeholder.com/200x200?text=Toilet+4"
      }
    ];

    let cartTotal = 0;
    let itemCount = 0;

    // Render Products Dynamic Function
    function renderProducts() {
      const grid = document.getElementById("product-grid");
      grid.innerHTML = ""; // Clear existing UI

      products.forEach(item => {
        // Validation check for empty name
        const productName = item.title && item.title.trim() !== "" ? item.title : "Product Name Unavailable";

        const cardHTML = `
          <div class="bg-white rounded-2xl p-3 border border-gray-100 shadow-sm flex flex-col justify-between relative overflow-hidden">
            
            <!-- Discount Badge -->
            <span class="absolute top-3 left-3 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded-md z-1">
              ${item.discount}
            </span>

            <!-- Image Container -->
            <div class="w-full h-36 bg-gray-100 rounded-xl mb-3 overflow-hidden flex items-center justify-center">
              <img src="${item.image}" alt="${productName}" class="object-cover w-full h-full" />
            </div>

            <!-- Content Area -->
            <div class="flex-grow flex flex-col justify-between">
              <!-- Title with proper clamp -->
              <h3 class="product-title text-sm font-bold text-gray-800 leading-snug mb-1" title="${productName}">
                ${productName}
              </h3>

              <!-- Price Row -->
              <div class="flex items-baseline gap-2 mb-3">
                <span class="text-base font-extrabold text-gray-900">₹${item.price}</span>
                <span class="text-xs text-gray-400 line-through">₹${item.originalPrice}</span>
              </div>

              <!-- Add Button -->
              <button onclick="addToCart(${item.price})" class="w-full border-2 border-blue-500 text-blue-600 font-bold py-1.5 rounded-xl text-sm hover:bg-blue-50 active:scale-95 transition-all flex items-center justify-center gap-1">
                <span>+</span> Add
              </button>
            </div>

          </div>
        `;
        grid.innerHTML += cardHTML;
      });
    }

    // Add to Cart logic
    function addToCart(price) {
      cartTotal += price;
      itemCount += 1;

      // Update Header
      document.getElementById("cart-count").innerText = itemCount;

      // Update Floating Widget
      const floatingCart = document.getElementById("floating-cart");
      document.getElementById("floating-total").innerText = cartTotal;
      document.getElementById("floating-badge").innerText = itemCount;

      if(itemCount > 0) {
        floatingCart.classList.remove("hidden");
      }
    }

    // Run on Load
    renderProducts();
  </script>
</body>
</html>

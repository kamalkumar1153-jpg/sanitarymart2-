<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanitary Mart - Digital Showroom</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <!-- Firebase v9 Compatibility Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Top Header -->
  <div class="header">
    <div>
      <h1>Sanitary Mart</h1>
      <span class="subtitle">Digital Showroom</span>
    </div>
    <div class="status-pill">
      <span class="dot"></span> Live
    </div>
  </div>

  <!-- Announcement Ticker -->
  <div class="ticker">
    🎉 Flat 18% OFF on All Premium Showroom Items!
  </div>

  <!-- Search Bar -->
  <div class="search-box">
    <input type="text" id="search" placeholder="Search taps, showers, sanitaryware..." onkeyup="filterAndSort()">
  </div>

  <!-- Category Filter Pills -->
  <div class="categories">
    <button class="filter-btn active" onclick="filterData('All Products', this)">All Products</button>
    <button class="filter-btn" onclick="filterData('Sanitaryware', this)">Sanitaryware</button>
    <button class="filter-btn" onclick="filterData('Taps & Showers', this)">Taps & Showers</button>
    <button class="filter-btn" onclick="filterData('Health Faucet', this)">Health Faucet</button>
  </div>

  <!-- Product Grid Container -->
  <div class="product-grid" id="container">
    <div class="loading-state">
      <i class="fas fa-spinner fa-spin"></i>
      <p>Firebase se products load ho rahe hain...</p>
    </div>
  </div>

  <!-- Floating Actions -->
  <a href="https://wa.me/919024686665" class="float-wa" target="_blank" title="Chat on WhatsApp">
    <i class="fab fa-whatsapp"></i>
  </a>

  <div class="float-cart" onclick="openCartModal()" title="View Cart">
    <i class="fas fa-shopping-cart"></i>
    <div class="cart-badge" id="cartCount">0</div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Product Detail Modal -->
  <div id="prodModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('prodModal')">&times;</span>
      <img id="m-img" src="" alt="Product Image" class="modal-img">
      <h2 id="m-name" class="modal-title"></h2>
      <div id="m-price" class="modal-price"></div>
      <div class="modal-actions">
        <button onclick="addSelectedToCart()" class="btn-primary">Add to Cart</button>
        <a id="m-wa" href="#" target="_blank" class="btn-whatsapp">
          <i class="fab fa-whatsapp"></i> Inquiry
        </a>
      </div>
    </div>
  </div>

  <!-- Cart Modal -->
  <div id="cartModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('cartModal')">&times;</span>
      <h2>Your Cart</h2>
      <div id="cartList" class="cart-list"></div>
      <div class="cart-summary">
        <div>Total: ₹<span id="cartTotal">0</span></div>
        <button onclick="clearCart()" class="btn-secondary">Clear Cart</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

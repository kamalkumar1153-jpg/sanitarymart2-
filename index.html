<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanitary Mart</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .product-title {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.5rem;
      color: #1f2937;
      font-weight: 700;
      font-size: 0.875rem;
      line-height: 1.25rem;
      margin-top: 0.5rem;
      margin-bottom: 0.25rem;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-10">
    <div class="flex items-center gap-2">
      <span class="text-teal-600 text-2xl">🚿</span>
      <h1 class="text-xl font-bold text-teal-800">Sanitary Mart</h1>
    </div>
    <div class="border border-blue-500 text-blue-600 px-4 py-1.5 rounded-full text-sm font-semibold flex items-center gap-1.5">
      🛒 Cart <span id="cart-count" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">0</span>
    </div>
  </header>

  <!-- Categories -->
  <div class="p-4 flex gap-2 overflow-x-auto scrollbar-none">
    <button class="bg-teal-700 text-white px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap">All Products</button>
    <button class="bg-white border text-gray-700 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap">Taps & Faucets</button>
    <button class="bg-white border text-gray-700 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap">Wash Basins</button>
  </div>

  <!-- Main Container -->
  <main class="px-4">
    <!-- Loader -->
    <div id="loading" class="text-center py-12 text-gray-500 font-medium">
      Sanitary Mart Firebase se connect ho raha hai...
    </div>

    <!-- Product Grid -->
    <div id="product-grid" class="grid grid-cols-2 gap-3.5 hidden"></div>
  </main>

  <!-- Firebase v9 (Modular SDK) Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    // Aapki Exact Config Keys
    const firebaseConfig = {
      apiKey: "AIzaSyCuhd6WeneZFqkScgyahmkzGPV-U78Zb0s",
      authDomain: "sanitarymart-65014.firebaseapp.com",
      databaseURL: "https://sanitarymart-65014-default-rtdb.firebaseio.com",
      projectId: "sanitarymart-65014",
      storageBucket: "sanitarymart-65014.firebasestorage.app",
      messagingSenderId: "285578370716",
      appId: "1:285578370716:web:c47f43f25ad2ab86b25759",
      measurementId: "G-0XJC8RN90V"
    };

    // Firebase Init
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Database Reference (Agar aapka node name 'products' na ho, toh badal lein)
    const productsRef = ref(db, 'products');

    const grid = document.getElementById("product-grid");
    const loading = document.getElementById("loading");

    // Realtime Listener
    onValue(productsRef, (snapshot) => {
      grid.innerHTML = "";
      loading.classList.add("hidden");
      grid.classList.remove("hidden");

      if (!snapshot.exists()) {
        grid.innerHTML = `<div class="col-span-2 text-center py-10 text-gray-500 font-semibold">Firebase me koyi products nahi mile!</div>`;
        return;
      }

      snapshot.forEach((childSnapshot) => {
        const item = childSnapshot.val();

        // Title Safety Checks
        const name = item.title || item.name || item.productName || item.product_name || "Sanitary Product";

        // Image Path/URL Safety Checks
        const imgSrc = item.image || item.imageUrl || item.img || item.url || "https://via.placeholder.com/300?text=Sanitary+Mart";

        const cardHTML = `
          <div class="bg-white rounded-2xl p-3 border border-gray-100 shadow-sm flex flex-col justify-between relative overflow-hidden">
            
            ${item.discount ? `
              <span class="absolute top-2 left-2 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded z-10">
                ${item.discount}
              </span>
            ` : ''}

            <!-- Product Image -->
            <div class="w-full h-36 bg-gray-50 rounded-xl overflow-hidden flex items-center justify-center relative">
              <img 
                src="${imgSrc}" 
                alt="Product" 
                class="w-full h-full object-contain p-1"
                onerror="this.onerror=null; this.src='https://via.placeholder.com/300?text=No+Image';"
              />
            </div>

            <!-- Product Title -->
            <div class="product-title" title="${name}">
              ${name}
            </div>

            <!-- Price -->
            <div class="flex items-baseline gap-1.5 my-1">
              <span class="text-base font-extrabold text-gray-900">₹${item.price || 0}</span>
              ${item.originalPrice ? `<span class="text-xs text-gray-400 line-through">₹${item.originalPrice}</span>` : ''}
            </div>

            <!-- Add Button -->
            <button id="add-btn-${childSnapshot.key}" class="w-full mt-1 border-2 border-blue-500 text-blue-600 font-bold py-1.5 rounded-xl text-xs active:bg-blue-50 transition-all">
              + Add
            </button>

          </div>
        `;

        grid.innerHTML += cardHTML;
      });

      // Cart Counter Attachment
      setupCartListeners();

    }, (error) => {
      console.error("Firebase Read Error:", error);
      loading.innerText = "Connection Error! Check Realtime Database Rules.";
    });

    let cartCount = 0;
    function setupCartListeners() {
      const buttons = document.querySelectorAll('[id^="add-btn-"]');
      buttons.forEach(btn => {
        btn.onclick = () => {
          cartCount++;
          document.getElementById("cart-count").innerText = cartCount;
        };
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanitary Mart</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDKs (v8 compatibility mode) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    .product-title {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.5rem;
      color: #1f2937;
      font-weight: 700;
      font-size: 0.875rem;
      line-height: 1.25rem;
      margin-top: 0.5rem;
      margin-bottom: 0.25rem;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-10">
    <div class="flex items-center gap-2">
      <span class="text-teal-600 text-2xl">🚿</span>
      <h1 class="text-xl font-bold text-teal-800">Sanitary Mart</h1>
    </div>
    <div class="border border-blue-500 text-blue-600 px-4 py-1.5 rounded-full text-sm font-semibold flex items-center gap-1.5">
      🛒 Cart <span id="cart-count" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">0</span>
    </div>
  </header>

  <!-- Categories -->
  <div class="p-4 flex gap-2 overflow-x-auto scrollbar-none">
    <button class="bg-teal-700 text-white px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap">All Products</button>
    <button class="bg-white border text-gray-700 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap">Taps & Faucets</button>
    <button class="bg-white border text-gray-700 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap">Wash Basins</button>
  </div>

  <!-- Product Grid Container -->
  <main class="px-4">
    <!-- Loading Message -->
    <div id="loading" class="text-center py-10 text-gray-500 font-semibold">
      Firebase se products load ho rahe hain...
    </div>

    <div id="product-grid" class="grid grid-cols-2 gap-3.5 hidden">
      <!-- Firebase se dynamic products yahan render honge -->
    </div>
  </main>

  <!-- JavaScript Code -->
  <script>
    // ⚠️ STEP 1: Apni Firebase Project Keys Yahan Badlein
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase Initialize Karein
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // STEP 2: Firebase Realtime Listener
    // Apne node ka naam check karein: 'products', 'items', etc.
    const productsRef = database.ref('products');

    productsRef.on('value', (snapshot) => {
      const grid = document.getElementById("product-grid");
      const loading = document.getElementById("loading");

      grid.innerHTML = ""; // Clear loader/previous UI
      loading.classList.add("hidden");
      grid.classList.remove("hidden");

      if (!snapshot.exists()) {
        grid.innerHTML = `<div class="col-span-2 text-center py-8 text-gray-500">Koyi products nahi mile database me!</div>`;
        return;
      }

      snapshot.forEach((childSnapshot) => {
        const item = childSnapshot.val();

        // Safe Name Fetching
        const name = item.title || item.name || item.productName || item.product_name || "Sanitary Item";

        // Safe Image Fetching (Aapke database me jo key ho: image, imageUrl, img, URL)
        const imgSrc = item.image || item.imageUrl || item.img || item.url || "https://via.placeholder.com/300?text=No+Image";

        const cardHTML = `
          <div class="bg-white rounded-2xl p-3 border border-gray-100 shadow-sm flex flex-col justify-between relative overflow-hidden">
            
            <!-- Discount -->
            ${item.discount ? `
              <span class="absolute top-2 left-2 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded z-10">
                ${item.discount}
              </span>
            ` : ''}

            <!-- Product Image -->
            <div class="w-full h-36 bg-gray-50 rounded-xl overflow-hidden flex items-center justify-center relative">
              <img 
                src="${imgSrc}" 
                alt="Product" 
                class="w-full h-full object-contain p-1"
                onerror="this.onerror=null; this.src='https://via.placeholder.com/300?text=Image+Error';"
              />
            </div>

            <!-- Title -->
            <div class="product-title">
              ${name}
            </div>

            <!-- Price -->
            <div class="flex items-baseline gap-1.5 my-1">
              <span class="text-base font-extrabold text-gray-900">₹${item.price || 0}</span>
              ${item.originalPrice ? `<span class="text-xs text-gray-400 line-through">₹${item.originalPrice}</span>` : ''}
            </div>

            <!-- Button -->
            <button onclick="addToCart()" class="w-full mt-1 border-2 border-blue-500 text-blue-600 font-bold py-1.5 rounded-xl text-xs active:bg-blue-50 transition-all">
              + Add
            </button>

          </div>
        `;

        grid.innerHTML += cardHTML;
      });
    }, (error) => {
      console.error("Firebase Error:", error);
      document.getElementById("loading").innerText = "Database connection error: " + error.message;
    });

    // Simple Cart Handler
    let cartCount = 0;
    function addToCart() {
      cartCount++;
      document.getElementById("cart-count").innerText = cartCount;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanitary Mart</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Product title spacing & truncation */
    .product-title {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.6rem;
      color: #1f2937;
      font-weight: 700;
      font-size: 0.875rem;
      line-height: 1.25rem;
      margin-top: 0.5rem;
      margin-bottom: 0.25rem;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-10">
    <div class="flex items-center gap-2">
      <span class="text-teal-600 text-2xl">🚿</span>
      <h1 class="text-xl font-bold text-teal-800">Sanitary Mart</h1>
    </div>
    <div class="border border-blue-500 text-blue-600 px-4 py-1.5 rounded-full text-sm font-semibold flex items-center gap-1.5">
      🛒 Cart <span id="cart-count" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">0</span>
    </div>
  </header>

  <!-- Category Filter Tabs -->
  <div class="p-4 flex gap-2 overflow-x-auto scrollbar-none">
    <button class="bg-teal-700 text-white px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap">All Products</button>
    <button class="bg-white border text-gray-700 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap">Taps & Faucets</button>
    <button class="bg-white border text-gray-700 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap">Wash Basins</button>
  </div>

  <!-- Product Grid Container -->
  <main class="px-4">
    <div id="product-grid" class="grid grid-cols-2 gap-3.5">
      <!-- JavaScript Dynamic Render Area -->
    </div>
  </main>

  <!-- JavaScript Code -->
  <script>
    // Database Products Data
    const databaseProducts = [
      {
        id: "1",
        title: "Edge One Piece Toilet Seat",
        price: 20243,
        originalPrice: 26990,
        discount: "25% OFF",
        image: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=400&auto=format&fit=crop&q=80"
      },
      {
        id: "2",
        name: "Sanitary Modern Western Closet",
        price: 13293,
        originalPrice: 18990,
        discount: "30% OFF",
        imageUrl: "https://images.unsplash.com/photo-1585058003661-383777096c42?w=400&auto=format&fit=crop&q=80"
      },
      {
        id: "3",
        productName: "Floor Mounted Water Closet...",
        price: 15400,
        originalPrice: 22000,
        discount: "30% OFF",
        img: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=400&auto=format&fit=crop&q=80"
      },
      {
        id: "4",
        title: "Sanitary Product Item",
        price: 18500,
        originalPrice: 24000,
        discount: "30% OFF",
        image: "https://images.unsplash.com/photo-1585058003661-383777096c42?w=400&auto=format&fit=crop&q=80"
      }
    ];

    // Default Fallback Image Link
    const DEFAULT_IMAGE = "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=400&auto=format&fit=crop&q=80";

    function renderProducts(items) {
      const grid = document.getElementById("product-grid");
      grid.innerHTML = "";

      items.forEach(item => {
        // Name Fallbacks
        const name = item.title || item.name || item.productName || item.product_name || "Sanitary Product Item";

        // Image Path/URL Fallbacks (No text/name shown for missing images)
        const imgSrc = item.image || item.imageUrl || item.img || item.img_url || DEFAULT_IMAGE;

        const cardHTML = `
          <div class="bg-white rounded-2xl p-3 border border-gray-100 shadow-sm flex flex-col justify-between relative overflow-hidden">
            
            <!-- Discount Tag -->
            <span class="absolute top-2 left-2 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded z-10">
              ${item.discount || '30% OFF'}
            </span>

            <!-- Product Image Container -->
            <div class="w-full h-36 bg-gray-50 rounded-xl overflow-hidden flex items-center justify-center relative">
              <img 
                src="${imgSrc}" 
                alt="Product" 
                class="w-full h-full object-cover"
                onerror="this.onerror=null; this.src='${DEFAULT_IMAGE}';"
              />
            </div>

            <!-- Title -->
            <div class="product-title">
              ${name}
            </div>

            <!-- Price -->
            <div class="flex items-baseline gap-1.5 my-1">
              <span class="text-base font-extrabold text-gray-900">₹${item.price}</span>
              ${item.originalPrice ? `<span class="text-xs text-gray-400 line-through">₹${item.originalPrice}</span>` : ''}
            </div>

            <!-- Button -->
            <button onclick="addToCart()" class="w-full mt-1 border-2 border-blue-500 text-blue-600 font-bold py-1.5 rounded-xl text-xs active:bg-blue-50 transition-all">
              + Add
            </button>

          </div>
        `;
        grid.innerHTML += cardHTML;
      });
    }

    let cartCount = 0;
    function addToCart() {
      cartCount++;
      document.getElementById("cart-count").innerText = cartCount;
    }

    // App Run
    renderProducts(databaseProducts);
  </script>
</body>
</html>
